name: antitrust QA

on:
  push:
  pull_request:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
    inputs:
      test_tier:
        description: 'Test tier for manual QA'
        required: false
        default: 'extended'
        type: choice
        options:
          - extended
          - nightly

jobs:
  formal-tests:
    name: R ${{ matrix.r }}
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    env:
      ANTITRUST_TEST_TIER: fast
    strategy:
      fail-fast: false
      matrix:
        # oldrel-1 is the minimum compatibility line selected for this audit;
        # release is the pinned canonical line and devel catches API drift.
        r: [oldrel-1, release, devel]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Record source revision and test tier
        shell: bash
        run: |
          core_sha="$(git rev-parse HEAD)"
          provenance_file="${RUNNER_TEMP}/antitrust-source-revisions.txt"
          {
            echo "core_sha=${core_sha}"
            echo "test_tier=${ANTITRUST_TEST_TIER}"
          } | tee "${provenance_file}"
          {
            echo "### Source provenance"
            echo
            echo "- core SHA: \`${core_sha}\`"
            echo "- test tier: \`${ANTITRUST_TEST_TIER}\`"
          } >> "${GITHUB_STEP_SUMMARY}"
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.r }}
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: any::testthat, any::pkgload, any::BB, any::numDeriv, any::nleqslv, any::SQUAREM, any::ggplot2, any::knitr, any::bookdown, any::rmarkdown, any::competitiontoolbox
      - name: Run formal synthetic QA
        run: Rscript ai/package_audit/run_qa.R . qa-output
      - name: Upload QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-r-${{ matrix.r }}
          path: |
            qa-output
            ${{ runner.temp }}/antitrust-source-revisions.txt

  canonical-check:
    name: Canonical R 4.6.1 check --as-cran
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    env:
      ANTITRUST_TEST_TIER: fast
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Record source revision and test tier
        shell: bash
        run: |
          core_sha="$(git rev-parse HEAD)"
          provenance_file="${RUNNER_TEMP}/antitrust-source-revisions.txt"
          {
            echo "core_sha=${core_sha}"
            echo "test_tier=${ANTITRUST_TEST_TIER}"
          } | tee "${provenance_file}"
          {
            echo "### Source provenance"
            echo
            echo "- core SHA: \`${core_sha}\`"
            echo "- test tier: \`${ANTITRUST_TEST_TIER}\`"
          } >> "${GITHUB_STEP_SUMMARY}"
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.6.1'
      - uses: r-lib/actions/setup-tinytex@v2
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: any::testthat, any::pkgload, any::BB, any::numDeriv, any::nleqslv, any::SQUAREM, any::ggplot2, any::knitr, any::bookdown, any::rmarkdown, any::competitiontoolbox
      - name: Run reproducibility runner
        run: Rscript ai/package_audit/run_qa.R . qa-output
      - name: Build package
        run: R CMD build --no-build-vignettes --no-manual --no-resave-data .
      - name: Check package
        run: R CMD check --as-cran antitrust_*.tar.gz
      - name: Upload canonical evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-canonical-r-4.6.1
          path: |
            qa-output
            ${{ runner.temp }}/antitrust-source-revisions.txt

  tiered-qa:
    name: Tiered QA (scheduled/manual)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    env:
      ANTITRUST_TEST_TIER: ${{ github.event_name == 'schedule' && 'nightly' || inputs.test_tier || 'extended' }}
    steps:
      - uses: actions/checkout@v4
      - name: Record source revision and test tier
        shell: bash
        run: |
          core_sha="$(git rev-parse HEAD)"
          provenance_file="${RUNNER_TEMP}/antitrust-source-revisions.txt"
          {
            echo "core_sha=${core_sha}"
            echo "test_tier=${ANTITRUST_TEST_TIER}"
          } | tee "${provenance_file}"
          {
            echo "### Source provenance"
            echo
            echo "- core SHA: \`${core_sha}\`"
            echo "- test tier: \`${ANTITRUST_TEST_TIER}\`"
          } >> "${GITHUB_STEP_SUMMARY}"
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.6.1'
      - uses: r-lib/actions/setup-tinytex@v2
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: any::testthat, any::pkgload, any::BB, any::numDeriv, any::nleqslv, any::SQUAREM, any::ggplot2, any::knitr, any::bookdown, any::rmarkdown, any::competitiontoolbox
      - name: Run selected reproducibility runner
        run: Rscript ai/package_audit/run_qa.R . "qa-output-${ANTITRUST_TEST_TIER}"
      - name: Build package
        run: R CMD build --no-build-vignettes --no-manual --no-resave-data .
      - name: Check package with selected tier
        run: R CMD check --as-cran antitrust_*.tar.gz
      - name: Upload selected-tier evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-${{ env.ANTITRUST_TEST_TIER }}-r-4.6.1
          path: |
            qa-output-${{ env.ANTITRUST_TEST_TIER }}
            ${{ runner.temp }}/antitrust-source-revisions.txt
